# Publicación en producción (icatacama.com): S3 + invalidación de CloudFront.
# Credenciales por OIDC (sin claves de acceso): el rol lo crea deploy/cloudformation.yaml con GitHubRepo.
# Configura en el repositorio:
#   - Environment "production" (Settings → Environments), idealmente con revisores obligatorios.
#   - Secreto AWS_DEPLOY_ROLE_ARN (salida DeployRoleArn de la pila).
#   - Variables S3_BUCKET y CLOUDFRONT_DISTRIBUTION_ID (salidas BucketName y DistributionId).
name: Publicar en producción
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://icatacama.com
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Ubicar proyecto
        id: dir
        run: |
          if [ -f package.json ]; then echo "dir=." >> "$GITHUB_OUTPUT"; elif [ -f web/package.json ]; then echo "dir=web" >> "$GITHUB_OUTPUT"; else echo "No se encontró package.json" && exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ steps.dir.outputs.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.dir.outputs.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.dir.outputs.dir }}
      - run: npm run audit
        working-directory: ${{ steps.dir.outputs.dir }}
      - run: npm run build
        working-directory: ${{ steps.dir.outputs.dir }}
      - run: npm run verify
        working-directory: ${{ steps.dir.outputs.dir }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: bash deploy/deploy.sh
        working-directory: ${{ steps.dir.outputs.dir }}
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
