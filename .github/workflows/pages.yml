# Copia de revisión en GitHub Pages (rama develop): se publica con noindex y robots.txt cerrado.
# Modo clásico: el workflow construye el sitio y sube dist/ a la rama gh-pages.
# Configura Pages en Settings → Pages → Source: "Deploy from a branch", rama gh-pages, carpeta / (root).
# BASE_PATH se fija a /<repositorio>/ (Pages de proyecto). Si Pages usa un dominio propio, pon BASE_PATH=/.
name: Revisión en GitHub Pages
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: write # necesario para escribir la rama gh-pages
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Ubicar proyecto
        id: dir
        run: |
          if [ -f package.json ]; then echo "dir=." >> "$GITHUB_OUTPUT"; elif [ -f web/package.json ]; then echo "dir=web" >> "$GITHUB_OUTPUT"; else echo "No se encontró package.json" && exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ steps.dir.outputs.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.dir.outputs.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.dir.outputs.dir }}
      - run: npm run build
        working-directory: ${{ steps.dir.outputs.dir }}
        env:
          SITE_ENV: preview
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run verify
        working-directory: ${{ steps.dir.outputs.dir }}
      - name: Publicar dist/ en la rama gh-pages
        working-directory: ${{ steps.dir.outputs.dir }}/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Revisión generada desde ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
