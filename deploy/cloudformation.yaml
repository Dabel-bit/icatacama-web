AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  IC Atacama - sitio estatico: bucket S3 privado + CloudFront (OAC, TLS 1.2+, cabeceras de seguridad,
  WAF opcional) + certificado ACM + registros Route 53 + rol de despliegue para GitHub Actions (OIDC).
  Debe crearse en us-east-1 (CloudFront exige ahi el certificado y el WAF).
  La CSP de ResponseHeadersPolicy debe ser identica a src/lib/security-headers.js (lo comprueba npm run verify).

Parameters:
  DomainName:
    Type: String
    Default: icatacama.com
    Description: Dominio principal (sin www). Se crea tambien www.<dominio> redirigido al principal.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Zona alojada de Route 53 del dominio (sus NS deben estar configurados en el registrador).
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_All incluye los puntos de presencia de Sudamerica (Santiago); los otros sirven Chile desde EE. UU.
  EnableWaf:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Crea un WAF con reglas administradas de AWS y limite de peticiones (costo base aprox. USD 10/mes).
  EnableLogging:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Guarda los registros de acceso de CloudFront en un bucket privado (90 dias).
  GitHubRepo:
    Type: String
    Default: ''
    Description: "Repositorio GitHub con formato propietario/repositorio para desplegar via OIDC sin claves. Vacio = no crear el rol."
  GitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: ARN del proveedor OIDC de GitHub si ya existe en la cuenta (solo puede haber uno). Vacio = crearlo.

Conditions:
  UseWaf: !Equals [!Ref EnableWaf, 'true']
  UseLogging: !Equals [!Ref EnableLogging, 'true']
  CreateDeployRole: !Not [!Equals [!Ref GitHubRepo, '']]
  CreateOidcProvider: !And
    - !Condition CreateDeployRole
    - !Equals [!Ref GitHubOidcProviderArn, '']

Resources:
  # ---------- Almacenamiento: bucket privado, cifrado y con versiones (permite volver atras) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: versiones-antiguas
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloCloudFrontConOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenegarSinTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  LogBucket:
    Type: AWS::S3::Bucket
    Condition: UseLogging
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # CloudFront escribe los registros con ACL: el bucket debe aceptar ACLs (ObjectWriter)
      OwnershipControls:
        Rules: [{ ObjectOwnership: ObjectWriter }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expirar-registros
            Status: Enabled
            ExpirationInDays: 90

  # ---------- Certificado TLS (validacion DNS automatica en la zona) ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub 'www.${DomainName}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub 'www.${DomainName}', HostedZoneId: !Ref HostedZoneId }

  # ---------- CloudFront ----------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: Cabeceras de seguridad del sitio (ver src/lib/security-headers.js)
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          XSSProtection: { Protection: false, Override: true }
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: "same-origin"
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: "same-origin"
              Override: true
        RemoveHeadersConfig:
          Items:
            - { Header: Server }
            - { Header: x-amz-server-side-encryption }
            - { Header: x-amz-version-id }

  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-viewer-request'
      AutoPublish: true
      FunctionConfig:
        Comment: www -> dominio principal, bloqueo de rutas ocultas, /ruta -> /ruta/ y /ruta/ -> index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var CANONICAL_HOST = '${DomainName}';

        function querystring(request) {
          var q = request.querystring;
          var parts = [];
          for (var k in q) {
            var values = q[k].multiValue ? q[k].multiValue : [q[k]];
            for (var i = 0; i < values.length; i++) {
              parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(values[i].value));
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: location } },
          };
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var host = request.headers.host ? request.headers.host.value.toLowerCase() : '';

          if (host && host !== CANONICAL_HOST) {
            return redirect('https://' + CANONICAL_HOST + uri + querystring(request));
          }
          if (uri.indexOf('..') !== -1 || uri.indexOf('//') !== -1 || (uri.indexOf('/.') !== -1 && uri.indexOf('/.well-known/') !== 0)) {
            return { statusCode: 404, statusDescription: 'Not Found' };
          }
          var hasExtension = uri.lastIndexOf('.') > uri.lastIndexOf('/');
          if (!hasExtension) {
            if (uri.charAt(uri.length - 1) !== '/') {
              return redirect('https://' + CANONICAL_HOST + uri + '/' + querystring(request));
            }
            request.uri = uri + 'index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Sitio ${DomainName}'
        Aliases: [!Ref DomainName, !Sub 'www.${DomainName}']
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        WebACLId: !If [UseWaf, !GetAtt WebAcl.Arn, !Ref 'AWS::NoValue']
        Logging: !If
          - UseLogging
          - { Bucket: !GetAtt LogBucket.DomainName, Prefix: cloudfront/, IncludeCookies: false }
          - !Ref 'AWS::NoValue'
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-sitio
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: s3-sitio
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # politica administrada CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # El bucket privado responde 403 a lo que no existe: se muestra la pagina 404 real con codigo 404
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

  # ---------- WAF opcional: reglas administradas de AWS + limite de peticiones por IP ----------
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseWaf
    Properties:
      Name: !Sub '${AWS::StackName}-waf'
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub '${AWS::StackName}-waf' }
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesCommonRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common }
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: badinputs }
        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 2
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: reputation }
        - Name: LimitePorIP
          Priority: 3
          Action: { Block: {} }
          Statement: { RateBasedStatement: { Limit: 2000, AggregateKeyType: IP } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ratelimit }

  # ---------- DNS ----------
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub 'www.${DomainName}'
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub 'www.${DomainName}'
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  # ---------- Despliegue desde GitHub Actions sin claves de acceso (OIDC) ----------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]  # AWS valida el certificado de GitHub; la huella es solo requisito formal

  DeployRole:
    Type: AWS::IAM::Role
    Condition: CreateDeployRole
    Properties:
      RoleName: !Sub '${AWS::StackName}-github-deploy'
      Description: Permite a GitHub Actions (entorno production del repo) publicar el sitio.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref GitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Solo el entorno "production" del repositorio (configurado en el workflow deploy-prod.yml)
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:environment:production'
      Policies:
        - PolicyName: publicar-sitio
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteUrl:
    Value: !Sub 'https://${DomainName}/'
  BucketName:
    Description: Valor de S3_BUCKET para npm run deploy / variable del repositorio
    Value: !Ref SiteBucket
  DistributionId:
    Description: Valor de CLOUDFRONT_DISTRIBUTION_ID
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Condition: CreateDeployRole
    Description: Valor del secreto AWS_DEPLOY_ROLE_ARN en GitHub
    Value: !GetAtt DeployRole.Arn
